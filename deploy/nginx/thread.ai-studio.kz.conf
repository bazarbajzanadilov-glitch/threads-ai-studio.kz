server {
    listen 80;
    listen [::]:80;
    server_name thread.ai-studio.kz 89.207.249.39;

    # Redirect HTTP to HTTPS (uncomment after obtaining SSL with Certbot)
    # return 301 https://$host$request_uri;

    client_max_body_size 50M;

    # Public uploads folder (served directly by Nginx with open CORS for Meta Threads image crawlers)
    location /uploads/ {
        alias /var/www/thread.ai-studio.kz/data/uploads/;
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
        add_header Cross-Origin-Resource-Policy cross-origin always;
        expires 30d;
        add_header Cache-Control "public, no-transform";
        try_files $uri =404;
    }

    # Proxy all API and frontend requests to Node.js backend
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 90s;
    }
}

